[package]
name = "apalis-nats"
version = "0.1.0-rc.5"
edition = "2024"
authors = ["Njuguna Mureithi <mureithinjuguna@gmail.com>"]
repository = "https://github.com/apalis-dev/apalis-nats"
license-file = "LICENSE"
description = "Background task processing for rust using apalis and nats jetstream"
readme = "README.md"
homepage = "https://github.com/apalis-dev/apalis-nats"
documentation = "https://docs.rs/apalis-nats"
keywords = ["apalis", "nats", "messages", "queue", "worker"]
categories = ["asynchronous", "database", "network-programming"]

[dependencies]
apalis-core = { version = "1.0.0-rc.10", default-features = false, features = [
    "sleep",
    "ulid",
] }
apalis-codec = { version = "0.1.0-rc.10", default-features = false, features = [
    "json",
] }
async-nats = { version = "0.50.0", features = [
    "jetstream",
    "server_2_12",
], default-features = false }
futures = "0.3.34"
thiserror = "2.0.21"
ulid = { version = "3", features = ["serde"] }
tracing = "0.1"


[dev-dependencies]
tokio = { version = "1", features = ["full"] }
apalis = "1.0.0-rc.10"
apalis-workflow = { version = "0.1.0-rc.10" }


[lints.rust]
unsafe_code = "forbid"

rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
type_complexity = "allow"
await_holding_lock = "warn"
dbg_macro = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
exit = "warn"
filter_map_next = "warn"
fn_params_excessive_bools = "warn"
if_let_mutex = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
must_use_candidate = "warn"
needless_borrow = "warn"
needless_continue = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
option_option = "warn"
redundant_clone = "warn"
ref_option = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_self_not_must_use = "warn"
single_match_else = "warn"
str_to_string = "warn"
suboptimal_flops = "warn"
todo = "warn"
trivially_copy_pass_by_ref = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
use_self = "warn"
verbose_file_reads = "warn"
